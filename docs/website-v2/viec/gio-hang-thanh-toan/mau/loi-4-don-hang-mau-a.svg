<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812"><rect width="375" height="812" fill="#FEFCF9"/><rect width="375" height="56" fill="#fff"/><text x="18" y="36" font-family="Arial" font-size="16" font-weight="700" fill="#20252D">‹　Thông tin đặt hàng</text><text x="18" y="92" font-family="Arial" font-size="22" font-weight="700" fill="#20252D">Thông tin đặt hàng</text><rect x="12" y="112" width="351" height="58" rx="12" fill="#fff" stroke="#EAE4D9"/><text x="26" y="147" font-family="Arial" font-size="14" font-weight="700" fill="#20252D">Đơn hàng (3 món)</text><text x="245" y="147" font-family="Arial" font-size="14" font-weight="700" fill="#20252D">1.350.000₫</text><text x="330" y="147" font-family="Arial" font-size="20" fill="#235CE3">⌄</text><rect x="12" y="186" width="351" height="175" rx="12" fill="#fff"/><text x="28" y="218" font-family="Arial" font-size="17" font-weight="700" fill="#20252D">1. Người nhận</text><text x="28" y="251" font-family="Arial" font-size="13" font-weight="700" fill="#20252D">Họ tên *</text><rect x="28" y="260" width="319" height="48" rx="8" fill="#fff" stroke="#EAE4D9"/><text x="42" y="290" font-family="Arial" font-size="14" fill="#8C95A5">Nguyễn Văn A</text><text x="28" y="333" font-family="Arial" font-size="13" font-weight="700" fill="#20252D">Số điện thoại *</text><rect x="12" y="377" width="351" height="224" rx="12" fill="#fff"/><text x="28" y="409" font-family="Arial" font-size="17" font-weight="700" fill="#20252D">2. Cách nhận hàng</text><rect x="28" y="426" width="319" height="52" rx="10" fill="#EBF0FC" stroke="#235CE3"/><text x="44" y="458" font-family="Arial" font-size="14" font-weight="700" fill="#20252D">◉　Đến cửa hàng lấy　·　0₫</text><rect x="28" y="488" width="319" height="52" rx="10" fill="#fff" stroke="#EAE4D9"/><text x="44" y="520" font-family="Arial" font-size="14" fill="#20252D">○　Giao nội thành　·　20.000₫</text><rect x="28" y="550" width="319" height="38" rx="10" fill="#fff" stroke="#EAE4