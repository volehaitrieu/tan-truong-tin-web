<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Đăng nhập quản trị - Tân Trường Tín</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#0d6b45',
              hover: '#0a5537',
              dark: '#08432b',
              light: '#e8f5ee',
              border: '#b7e1ce',
            },
            surface: {
              DEFAULT: '#f8f9ff',
              container: '#ffffff',
              dim: '#eef2f6',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Safe area utilities */
    .pt-safe {
      padding-top: env(safe-area-inset-top, 54px);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 34px);
    }
  </style>
</head>
<body class="bg-surface text-slate-800 min-h-full flex flex-col justify-between selection:bg-brand selection:text-white">

  <!-- Top Safe Area & Status Bar spacer -->
  <div class="w-full pt-safe">
    <!-- Dynamic Island / Top status simulation area if needed, left clean -->
    <div class="h-4"></div>
  </div>

  <!-- Main Content Container: Full-screen single column, no card border -->
  <main class="w-full max-w-[440px] mx-auto px-6 py-4 flex-1 flex flex-col justify-center">

    <!-- Logo & Brand Header -->
    <div class="flex flex-col items-center text-center mb-8">
      <!-- Store Emblem / Icon -->
      <div class="w-16 h-16 rounded-2xl bg-brand flex items-center justify-center text-white shadow-md shadow-brand/20 mb-3.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      </div>
      
      <!-- Brand Name -->
      <h1 class="text-2xl font-extrabold text-brand tracking-tight uppercase">
        TÂN TRƯỜNG TÍN
      </h1>
      <!-- Subtitle -->
      <p class="text-[12px] font-semibold text-slate-500 uppercase tracking-wider mt-1">
        Điện nước • Kim khí • Gia dụng
      </p>

      <div class="w-12 h-0.5 bg-slate-200 mt-5 mb-5 rounded-full"></div>

      <!-- Page Title -->
      <h2 class="text-xl font-bold text-slate-900 tracking-tight">
        Đăng nhập quản trị
      </h2>
      <p class="text-xs text-slate-500 mt-1">
        Dành cho chủ cửa hàng và nhân viên nội bộ
      </p>
    </div>

    <!-- Login Form -->
    <form class="space-y-4" onsubmit="event.preventDefault();">
      
      <!-- Field: Số điện thoại hoặc email -->
      <div>
        <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
          Số điện thoại hoặc email
        </label>
        <div class="relative">
          <input
            id="username"
            type="text"
            value="0948732064"
            class="w-full h-12 px-4 rounded-xl border border-slate-300 bg-white text-slate-900 text-base font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand transition-all shadow-sm"
            placeholder="Nhập SĐT hoặc email"
            autocomplete="username"
          />
        </div>
      </div>

      <!-- Field: Mật khẩu -->
      <div>
        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
          Mật khẩu
        </label>
        <div class="relative">
          <input
            id="password"
            type="password"
            value="••••••••••••"
            class="w-full h-12 pl-4 pr-12 rounded-xl border border-red-500 bg-white text-slate-900 text-base tracking-widest focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-red-500 transition-all shadow-sm"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
          />
          <!-- Eye icon -->
          <button 
            type="button" 
            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 focus:outline-none"
            aria-label="Hiện/ẩn mật khẩu"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>

        <!-- Inline error message under password -->
        <div class="flex items-center gap-1.5 mt-2 text-red-600 text-xs font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <span>Sai số điện thoại/email hoặc mật khẩu</span>
        </div>
      </div>

      <!-- Checkbox: Ghi nhớ đăng nhập -->
      <div class="pt-1">
        <label class="inline-flex items-center gap-2.5 cursor-pointer select-none">
          <input 
            type="checkbox" 
            checked 
            class="w-5 h-5 rounded-md border-slate-300 text-brand focus:ring-brand focus:ring-offset-0 transition cursor-pointer accent-[#0d6b45]"
          />
          <span class="text-sm font-medium text-slate-700">Ghi nhớ đăng nhập</span>
        </label>
      </div>

      <!-- Full-width Primary Button: Đăng nhập -->
      <div class="pt-2">
        <button
          type="submit"
          class="w-full h-12 bg-brand hover:bg-brand-hover active:bg-brand-dark text-white font-semibold text-base rounded-xl flex items-center justify-center gap-2 shadow-md shadow-brand/25 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand"
        >
          <span>Đăng nhập</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </div>

      <!-- Forgot password helper -->
      <div class="text-center pt-2">
        <span class="text-xs text-slate-500">
          Quên mật khẩu? <a href="#" class="font-semibold text-brand hover:underline">Liên hệ chủ shop</a>
        </span>
      </div>

    </form>
  </main>

  <!-- Footer Info & Safe Area -->
  <footer class="w-full max-w-[440px] mx-auto px-6 pb-safe pt-4 text-center">
    <div class="border-t border-slate-200/80 pt-4 pb-2">
      <p class="text-xs font-medium text-slate-600">
        379 đường 2/4, Bắc Nha Trang • 0948 732 064
      </p>
      <p class="text-[11px] text-slate-400 mt-1">
        Hệ thống quản lý bán lẻ Tân Trường Tín v2.4
      </p>
    </div>
  </footer>

</body>
</html>
