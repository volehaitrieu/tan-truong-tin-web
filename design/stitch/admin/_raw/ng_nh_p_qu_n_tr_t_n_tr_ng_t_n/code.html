<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập quản trị - Tân Trường Tín</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#0d6b45',
              hover: '#0a5637',
              light: '#e6f3ed',
              dark: '#08452c',
            },
            surface: {
              page: '#f8f9fc',
              card: '#ffffff',
              border: '#e2e8f0',
              input: '#ffffff',
              muted: '#64748b',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-full bg-[#f4f6f8] text-slate-800 flex flex-col justify-between selection:bg-[#0d6b45] selection:text-white">

  <!-- Header top spacing spacer -->
  <div class="h-6 sm:h-12 w-full"></div>

  <!-- Main Container -->
  <main class="w-full max-w-md mx-auto px-4 py-6">
    <div class="bg-white border border-slate-200/90 rounded-2xl shadow-sm p-7 sm:p-8">
      
      <!-- Logo & Branding -->
      <div class="text-center mb-7">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-[#0d6b45] text-white shadow-sm mb-3.5">
          <!-- Hardware / Store SVG Emblem -->
          <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-[#0d6b45] uppercase">
          Tân Trường Tín
        </h1>
        <p class="text-xs font-medium tracking-wide text-slate-500 mt-1 uppercase">
          Điện nước • Kim khí • Gia dụng
        </p>
      </div>

      <!-- Page Title -->
      <div class="border-t border-slate-100 pt-5 mb-6 text-center">
        <h2 class="text-lg font-semibold text-slate-900">
          Đăng nhập quản trị
        </h2>
        <p class="text-xs text-slate-500 mt-0.5">
          Dành cho chủ cửa hàng và nhân viên nội bộ
        </p>
      </div>

      <!-- Login Form -->
      <form onsubmit="event.preventDefault();" class="space-y-4.5">
        <!-- Field 1: Phone or Email -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5" for="username">
            Số điện thoại hoặc email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <input 
              type="text" 
              id="username" 
              name="username" 
              value="0948732064"
              placeholder="09xx xxx xxx hoặc email..." 
              class="w-full pl-10 pr-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#0d6b45] focus:border-[#0d6b45] transition-all"
            />
          </div>
        </div>

        <!-- Field 2: Password -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5" for="password">
            Mật khẩu
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password" 
              value="••••••••••••"
              placeholder="Nhập mật khẩu..." 
              class="w-full pl-10 pr-10 py-2.5 bg-white border border-red-400 rounded-lg text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-red-400 transition-all"
            />
            <!-- Show/hide eye icon -->
            <button 
              type="button" 
              title="Hiện mật khẩu" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
            >
              <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <!-- Inline Error Example -->
          <div class="mt-2 flex items-start gap-1.5 text-xs font-medium text-red-600">
            <svg class="w-4 h-4 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span>Sai số điện thoại/email hoặc mật khẩu</span>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="pt-1 flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input 
              type="checkbox" 
              name="remember" 
              checked
              class="w-4 h-4 rounded border-slate-300 text-[#0d6b45] focus:ring-[#0d6b45] accent-[#0d6b45] transition"
            />
            <span class="text-xs text-slate-700 font-medium">Ghi nhớ đăng nhập</span>
          </label>
        </div>

        <!-- Full-width Primary Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            class="w-full py-2.5 px-4 bg-[#0d6b45] hover:bg-[#0a5637] active:bg-[#08452c] text-white font-medium text-sm rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-[#0d6b45] focus:ring-offset-2"
          >
            <span>Đăng nhập</span>
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </div>

        <!-- Helper Link -->
        <div class="text-center pt-2">
          <span class="text-xs text-slate-500">
            Quên mật khẩu? <a href="#" class="text-[#0d6b45] hover:underline font-medium">Liên hệ chủ shop</a>
          </span>
        </div>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full text-center py-6 text-xs text-slate-500 border-t border-slate-200/60 bg-white/50 mt-auto">
    <div class="max-w-md mx-auto px-4">
      <p class="font-medium text-slate-600">379 đường 2/4, Bắc Nha Trang • 0948 732 064</p>
      <p class="text-[11px] text-slate-400 mt-1">Hệ thống quản lý bán lẻ Tân Trường Tín v2.4</p>
    </div>
  </footer>

</body>
</html>
